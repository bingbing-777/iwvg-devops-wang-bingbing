server:
  port: 8085

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  hosting: AWS

spring:
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://postgres:5432/iwvgdevopsdb
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
